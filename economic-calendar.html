<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경제 캘린더 · SMK1004</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0e1013;
    --panel:#15181c;
    --panel2:#1a1e23;
    --line:#262b31;
    --text:#eceff1;
    --sub:#838d97;
    --brass:#c9a466;
    --red:#e0605a;
    --green:#4fbf7a;
    --sans:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:24px 16px 60px;
  }
  .wrap{max-width:560px; margin:0 auto;}
  .top{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .top a{
    color:var(--sub); text-decoration:none; font-size:14px;
    border:1px solid var(--line); padding:6px 12px; border-radius:8px;
  }
  .top a:hover{border-color:var(--brass); color:var(--brass);}
  h1{font-size:22px; font-weight:700; margin:0 0 4px;}
  .sub{color:var(--sub); font-size:14px; margin:0 0 20px;}

  .toolbar{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;
  }
  .chip{
    background:var(--panel); border:1px solid var(--line); color:var(--sub);
    font-size:13px; padding:7px 14px; border-radius:20px; cursor:pointer;
    font-family:var(--sans); user-select:none;
  }
  .chip.active{border-color:var(--brass); color:var(--brass); background:rgba(201,164,102,.1);}

  .status{color:var(--sub); font-size:12px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
  .status button{
    background:none; border:1px solid var(--line); color:var(--sub);
    font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer; font-family:var(--sans);
  }
  .status button:hover{border-color:var(--brass); color:var(--brass);}

  .day-group{margin-bottom:18px;}
  .day-label{
    font-size:13px; font-weight:700; color:var(--brass);
    margin-bottom:8px; padding-bottom:6px; border-bottom:1px solid var(--line);
  }

  .event{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }
  .event.past{opacity:.45;}
  .event-time{
    width:52px; flex-shrink:0; font-size:13px; font-weight:600;
    font-variant-numeric:tabular-nums; padding-top:2px;
  }
  .event-body{flex:1; min-width:0;}
  .event-head{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
  .ccy{
    font-size:11px; font-weight:700; color:var(--sub);
    background:var(--panel2); padding:2px 6px; border-radius:4px;
  }
  .stars{font-size:11px; letter-spacing:1px;}
  .stars.high{color:var(--red);}
  .stars.medium{color:var(--brass);}
  .stars.low{color:var(--sub);}
  .event-title{font-size:14px; font-weight:600; line-height:1.3;}
  .event-vals{display:flex; gap:14px; font-size:12px; color:var(--sub); margin-top:4px;}
  .event-vals b{color:var(--text); font-weight:600;}

  .empty{color:var(--sub); font-size:14px; text-align:center; padding:40px 0;}
  .err{color:var(--red); font-size:13px; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← 홈</a></div>
  <h1>경제 캘린더</h1>
  <p class="sub">이번 주 주요 경제지표 발표 일정 (한국시간 기준)</p>

  <div class="toolbar" id="impactFilter">
    <span class="chip active" data-impact="all">전체</span>
    <span class="chip" data-impact="High">★★★ 높음</span>
    <span class="chip" data-impact="Medium">★★☆ 보통</span>
    <span class="chip" data-impact="Low">★☆☆ 낮음</span>
  </div>

  <div class="status">
    <span id="statusText">불러오는 중…</span>
    <button id="refreshBtn">새로고침</button>
  </div>

  <div id="calendar"></div>
</div>

<script>
const IMPACT_STARS = {
  High: '<span class="stars high">★★★</span>',
  Medium: '<span class="stars medium">★★☆</span>',
  Low: '<span class="stars low">★☆☆</span>'
};

let allEvents = [];
let currentFilter = 'all';

// calendar-data.json은 GitHub Actions가 6시간마다 서버에서 미리 가져와 저장소에 저장해두는 파일
// (브라우저가 아닌 GitHub 서버가 요청하므로 CORS 문제 없음, 같은 출처 파일이라 항상 로드됨)
const DATA_URL = 'calendar-data.json?t=' + Date.now();

async function loadCalendar(){
  const statusEl = document.getElementById('statusText');
  const calEl = document.getElementById('calendar');
  statusEl.textContent = '불러오는 중…';
  calEl.innerHTML = '';

  try{
    const res = await fetch(DATA_URL);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('빈 데이터');

    allEvents = data.map(e => ({...e, dateObj: new Date(e.date)}))
                     .sort((a,b) => a.dateObj - b.dateObj);
    statusEl.textContent = `이번 주 ${allEvents.length}개 일정 · ${new Date().toLocaleTimeString('ko-KR')} 기준`;
    render();
  }catch(e){
    statusEl.textContent = '';
    calEl.innerHTML = '<div class="err">calendar-data.json을 찾을 수 없습니다. GitHub Actions가 아직 실행 전이거나 파일이 저장소에 없을 수 있습니다.</div>';
  }
}

function render(){
  const calEl = document.getElementById('calendar');
  const now = new Date();

  const filtered = currentFilter === 'all'
    ? allEvents
    : allEvents.filter(e => e.impact === currentFilter);

  if(filtered.length === 0){
    calEl.innerHTML = '<div class="empty">해당 조건의 일정이 없습니다.</div>';
    return;
  }

  // 한국시간(Asia/Seoul) 기준으로 날짜별 그룹핑 — 수동 시차 계산 없이 브라우저 표준 타임존 변환 사용
  const groups = {};
  for(const e of filtered){
    const kstDateKey = e.dateObj.toLocaleDateString('ko-KR', {
      timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
    });
    if(!groups[kstDateKey]) groups[kstDateKey] = [];
    groups[kstDateKey].push(e);
  }

  let html = '';
  for(const dateKey in groups){
    html += `<div class="day-group"><div class="day-label">${dateKey}</div>`;
    for(const e of groups[dateKey]){
      const timeStr = e.dateObj.toLocaleTimeString('ko-KR', {
        timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false
      });
      const isPast = e.dateObj < now;
      const stars = IMPACT_STARS[e.impact] || '';
      html += `
        <div class="event ${isPast ? 'past' : ''}">
          <div class="event-time">${timeStr}</div>
          <div class="event-body">
            <div class="event-head">
              <span class="ccy">${e.country}</span>
              ${stars}
            </div>
            <div class="event-title">${e.title}</div>
            ${(e.forecast || e.previous) ? `
            <div class="event-vals">
              ${e.forecast ? `<span>예상: <b>${e.forecast}</b></span>` : ''}
              ${e.previous ? `<span>이전: <b>${e.previous}</b></span>` : ''}
            </div>` : ''}
          </div>
        </div>`;
    }
    html += `</div>`;
  }
  calEl.innerHTML = html;
}

document.getElementById('impactFilter').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#impactFilter .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.impact;
  render();
});

document.getElementById('refreshBtn').addEventListener('click', loadCalendar);

loadCalendar();
</script>
</body>
</html>
