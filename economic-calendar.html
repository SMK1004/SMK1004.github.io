<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경제 캘린더 · SMK1004</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0e1013;
    --panel:#15181c;
    --panel2:#1a1e23;
    --line:#262b31;
    --text:#eceff1;
    --sub:#838d97;
    --brass:#c9a466;
    --red:#e0605a;
    --green:#4fbf7a;
    --sans:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:24px 16px 60px;
  }
  .wrap{max-width:560px; margin:0 auto;}
  .top{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .top a{
    color:var(--sub); text-decoration:none; font-size:14px;
    border:1px solid var(--line); padding:6px 12px; border-radius:8px;
  }
  .top a:hover{border-color:var(--brass); color:var(--brass);}
  h1{font-size:22px; font-weight:700; margin:0 0 4px;}
  .sub{color:var(--sub); font-size:14px; margin:0 0 18px;}

  .day-tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex-shrink:0;
    background:var(--panel); border:1px solid var(--line); color:var(--sub);
    font-size:13px; padding:8px 14px; border-radius:10px; cursor:pointer;
    font-family:var(--sans); user-select:none; text-align:center; line-height:1.3;
  }
  .day-tab .dow{display:block; font-size:11px; margin-top:1px;}
  .day-tab.active{border-color:var(--brass); color:var(--brass); background:rgba(201,164,102,.1);}
  .day-tab.today .dow{color:var(--green);}
  .day-tab.today.active .dow{color:var(--brass);}

  .toolbar{
    display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;
  }
  .chip{
    background:var(--panel); border:1px solid var(--line); color:var(--sub);
    font-size:13px; padding:7px 14px; border-radius:20px; cursor:pointer;
    font-family:var(--sans); user-select:none;
  }
  .chip.active{border-color:var(--brass); color:var(--brass); background:rgba(201,164,102,.1);}

  .status{color:var(--sub); font-size:12px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center;}
  .status button{
    background:none; border:1px solid var(--line); color:var(--sub);
    font-size:12px; padding:5px 10px; border-radius:6px; cursor:pointer; font-family:var(--sans);
  }
  .status button:hover{border-color:var(--brass); color:var(--brass);}

  .day-label{
    font-size:14px; font-weight:700; color:var(--brass);
    margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line);
  }

  .event{
    display:flex; gap:12px; align-items:flex-start;
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:8px;
  }
  .event.past{opacity:.45;}
  .event-time{
    width:52px; flex-shrink:0; font-size:13px; font-weight:600;
    font-variant-numeric:tabular-nums; padding-top:2px;
  }
  .event-body{flex:1; min-width:0;}
  .event-head{display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap;}
  .ccy{
    font-size:11px; font-weight:700; color:var(--sub);
    background:var(--panel2); padding:2px 6px; border-radius:4px;
  }
  .stars{font-size:11px; letter-spacing:1px;}
  .stars.high{color:var(--red);}
  .stars.medium{color:var(--brass);}
  .stars.low{color:var(--sub);}
  .event-title{font-size:14px; font-weight:600; line-height:1.3;}
  .event-vals{display:flex; gap:14px; font-size:12px; color:var(--sub); margin-top:4px;}
  .event-vals b{color:var(--text); font-weight:600;}

  .empty{color:var(--sub); font-size:14px; text-align:center; padding:40px 0;}
  .err{color:var(--red); font-size:13px; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← 홈</a></div>
  <h1>경제 캘린더</h1>
  <p class="sub">이번 주 주요 경제지표 발표 일정 (한국시간 기준)</p>

  <div class="day-tabs" id="dayTabs"></div>

  <div class="toolbar" id="impactFilter">
    <span class="chip active" data-impact="all">전체</span>
    <span class="chip" data-impact="High">★★★ 높음</span>
    <span class="chip" data-impact="Medium">★★☆ 보통</span>
    <span class="chip" data-impact="Low">★☆☆ 낮음</span>
  </div>

  <div class="status">
    <span id="statusText">불러오는 중…</span>
    <button id="refreshBtn">새로고침</button>
  </div>

  <div id="calendar"></div>
</div>

<script>
const IMPACT_STARS = {
  High: '<span class="stars high">★★★</span>',
  Medium: '<span class="stars medium">★★☆</span>',
  Low: '<span class="stars low">★☆☆</span>'
};

// 지표명 한국어 번역 사전 (ForexFactory 원문 → 한국어). 못 찾으면 원문 그대로 표시.
const TITLE_KO = {

  'Final CPI y/y': '확정 CPI (전년비)',
  'Final Core CPI y/y': '확정 근원 CPI (전년비)',
  'National Core CPI y/y': '전국 근원 CPI (전년비)',
  'RPI y/y': '소매물가지수 (전년비)',

  'PPI Output m/m': '생산자물가 산출 (전월비)',
  'PPI Output q/q': '생산자물가 산출 (전분기비)',
  'German PPI m/m': '독일 생산자물가 (전월비)',
  'IPPI m/m': '산업생산자물가 (전월비)',
  'NHPI m/m': '신규주택가격지수 (전월비)',
  'RMPI m/m': '원자재물가지수 (전월비)',
  'HPI y/y': '주택가격지수 (전년비)',
  'Rightmove HPI m/m': '라이트무브 주택가격 (전월비)',
  'New Home Prices m/m': '신규주택가격 (전월비)',

  'FOMC Meeting Minutes': 'FOMC 의사록',
  'ECB President Lagarde Speaks': 'ECB 라가르드 총재 연설',
  'RBA Deputy Gov Hauser Speaks': 'RBA 하우저 부총재 연설',
  'German Buba Monthly Report': '독일 분데스방크 월간 보고서',

  'Empire State Manufacturing Index': '엠파이어스테이트 제조업지수',
  'Philly Fed Manufacturing Index': '필라델피아 연은 제조업지수',
  'NAHB Housing Market Index': 'NAHB 주택시장지수',
  'CB Leading Index m/m': '경기선행지수 (전월비)',
  'Flash Manufacturing PMI': '제조업 PMI 예비치',
  'Flash Services PMI': '서비스업 PMI 예비치',
  'French Flash Manufacturing PMI': '프랑스 제조업 PMI 예비치',
  'French Flash Services PMI': '프랑스 서비스업 PMI 예비치',
  'German Flash Manufacturing PMI': '독일 제조업 PMI 예비치',
  'German Flash Services PMI': '독일 서비스업 PMI 예비치',
  'ZEW Economic Sentiment': 'ZEW 경기기대지수',
  'German ZEW Economic Sentiment': '독일 ZEW 경기기대지수',
  'CBI Industrial Order Expectations': 'CBI 산업수주기대지수',
  'GfK Consumer Confidence': 'GfK 소비자신뢰지수',
  'Consumer Confidence': '소비자신뢰지수',
  'Westpac Consumer Sentiment': '웨스트팩 소비자심리지수',
  'MI Inflation Expectations': '기대인플레이션',

  'Building Permits': '건축허가건수',
  'Housing Starts': '주택착공건수',

  'Revised Industrial Production m/m': '산업생산 수정치 (전월비)',

  'Unemployment Claims': '신규 실업수당청구건수',
  'ADP Weekly Employment Change': 'ADP 주간 고용변화',
  'Claimant Count Change': '실업수당청구 변화',
  'Employment Change': '고용변화',
  'Unemployment Rate': '실업률',
  'Average Earnings Index 3m/y': '평균소득지수 (3개월/전년비)',
  'Wage Price Index q/q': '임금지수 (전분기비)',

  'Retail Sales m/m': '소매판매 (전월비)',
  'Retail Sales y/y': '소매판매 (전년비)',
  'Core Retail Sales m/m': '근원 소매판매 (전월비)',
  'Import Prices m/m': '수입물가 (전월비)',

  'Trade Balance': '무역수지',
  'Current Account': '경상수지',
  'Foreign Securities Purchases': '해외증권 순매수',
  'Foreign Direct Investment ytd/y': '외국인직접투자 (연누계)',
  'Fixed Asset Investment ytd/y': '고정자산투자 (연누계)',
  'TIC Long-Term Purchases': 'TIC 장기증권 순매수',
  'Public Sector Net Borrowing': '공공부문 순차입',

  'Crude Oil Inventories': '원유재고',
  'Natural Gas Storage': '천연가스 재고',
  'API Weekly Statistical Bulletin': 'API 주간 재고보고서',
  'GDT Price Index': '글로벌유제품경매 가격지수',

  '10-y Bond Auction': '10년물 국채 입찰',
  'German 10-y Bond Auction': '독일 10년물 국채 입찰',
  '1-y Loan Prime Rate': '1년 대출우대금리(LPR)',
  '5-y Loan Prime Rate': '5년 대출우대금리(LPR)',

  'BusinessNZ Services Index': '뉴질랜드 서비스업지수',
  'FPI m/m': '식품가격지수 (전월비)',
  'Prelim GDP Price Index y/y': 'GDP 디플레이터 예비치 (전년비)',
  'Prelim GDP q/q': 'GDP 예비치 (전분기비)',
  'Credit Card Spending y/y': '신용카드 지출 (전년비)'
};

function translateTitle(title){
  return TITLE_KO[title] || title;
}

let allEvents = [];
let currentFilter = 'all';
let selectedDateKey = null;

// calendar-data.json은 GitHub Actions가 6시간마다 서버에서 미리 가져와 저장소에 저장해두는 파일
// (브라우저가 아닌 GitHub 서버가 요청하므로 CORS 문제 없음, 같은 출처 파일이라 항상 로드됨)
const DATA_URL = 'calendar-data.json?t=' + Date.now();

function kstDateKey(dateObj){
  // YYYY-MM-DD 형태의 정렬 가능한 키 (한국시간 기준)
  return dateObj.toLocaleDateString('sv-SE', { timeZone: 'Asia/Seoul' });
}

async function loadCalendar(){
  const statusEl = document.getElementById('statusText');
  const calEl = document.getElementById('calendar');
  statusEl.textContent = '불러오는 중…';
  calEl.innerHTML = '';

  try{
    const res = await fetch(DATA_URL);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if(!Array.isArray(data) || data.length === 0) throw new Error('빈 데이터');

    allEvents = data.map(e => ({...e, dateObj: new Date(e.date)}))
                     .sort((a,b) => a.dateObj - b.dateObj);
    statusEl.textContent = `이번 주 ${allEvents.length}개 일정 · ${new Date().toLocaleTimeString('ko-KR')} 기준`;

    const todayKey = kstDateKey(new Date());
    const availableKeys = [...new Set(allEvents.map(e => kstDateKey(e.dateObj)))].sort();
    selectedDateKey = availableKeys.includes(todayKey)
      ? todayKey
      : (availableKeys.find(k => k > todayKey) || availableKeys[0]);

    renderTabs();
    render();
  }catch(e){
    statusEl.textContent = '';
    calEl.innerHTML = '<div class="err">calendar-data.json을 찾을 수 없습니다. GitHub Actions가 아직 실행 전이거나 파일이 저장소에 없을 수 있습니다.</div>';
  }
}

function renderTabs(){
  const tabsEl = document.getElementById('dayTabs');
  const todayKey = kstDateKey(new Date());
  const keys = [...new Set(allEvents.map(e => kstDateKey(e.dateObj)))].sort();

  tabsEl.innerHTML = keys.map(key => {
    const [y, m, d] = key.split('-').map(Number);
    const md = `${m}/${d}`;
    const dow = new Date(key + 'T12:00:00+09:00').toLocaleDateString('ko-KR', { timeZone: 'Asia/Seoul', weekday: 'short' });
    const isToday = key === todayKey;
    const isActive = key === selectedDateKey;
    return `<div class="day-tab ${isActive ? 'active' : ''} ${isToday ? 'today' : ''}" data-key="${key}">
      ${md}<span class="dow">${isToday ? '오늘' : dow}</span>
    </div>`;
  }).join('');
}

function render(){
  const calEl = document.getElementById('calendar');
  const now = new Date();

  let filtered = allEvents.filter(e => kstDateKey(e.dateObj) === selectedDateKey);
  if(currentFilter !== 'all'){
    filtered = filtered.filter(e => e.impact === currentFilter);
  }

  if(filtered.length === 0){
    calEl.innerHTML = '<div class="empty">해당 조건의 일정이 없습니다.</div>';
    return;
  }

  const dateLabel = filtered[0].dateObj.toLocaleDateString('ko-KR', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric', weekday: 'long'
  });

  let html = `<div class="day-label">${dateLabel}</div>`;
  for(const e of filtered){
    const timeStr = e.dateObj.toLocaleTimeString('ko-KR', {
      timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false
    });
    const isPast = e.dateObj < now;
    const stars = IMPACT_STARS[e.impact] || '';
    html += `
      <div class="event ${isPast ? 'past' : ''}">
        <div class="event-time">${timeStr}</div>
        <div class="event-body">
          <div class="event-head">
            <span class="ccy">${e.country}</span>
            ${stars}
          </div>
          <div class="event-title">${translateTitle(e.title)}</div>
          ${(e.forecast || e.previous) ? `
          <div class="event-vals">
            ${e.forecast ? `<span>예상: <b>${e.forecast}</b></span>` : ''}
            ${e.previous ? `<span>이전: <b>${e.previous}</b></span>` : ''}
          </div>` : ''}
        </div>
      </div>`;
  }
  calEl.innerHTML = html;
}

document.getElementById('dayTabs').addEventListener('click', (e) => {
  const tab = e.target.closest('.day-tab');
  if(!tab) return;
  selectedDateKey = tab.dataset.key;
  renderTabs();
  render();
});

document.getElementById('impactFilter').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if(!chip) return;
  document.querySelectorAll('#impactFilter .chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  currentFilter = chip.dataset.impact;
  render();
});

document.getElementById('refreshBtn').addEventListener('click', loadCalendar);

loadCalendar();
</script>
</body>
</html>
