<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0e1013;
    --panel:#15181c;
    --panel2:#1a1e23;
    --line:#262b31;
    --text:#eceff1;
    --sub:#838d97;

  textarea{

  button{

  .err{color:var(--red); font-size:13px; margin-top:10px; display:none;}

  .set-group{
    background:var(--panel2); border:1px solid var(--line); border-radius:12px;

  .leg{

  .leg-top{
    display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;

  /* 모바일 전용: 그리드 없이 필드 하나하나를 통짜 한 줄로 세로 나열 — 잘리거나 스크롤될 여지 자체를 제거 */
  .field-row{
    display:flex; justify-content:space-between; align-items:center;

<body>
<div class="wrap">
  <div class="top"><a href="index.html">← 홈</a></div>
  <h1>포지션 한눈에</h1>
  <p class="sub">모든 세트를 한 번에 붙여넣으면 손익 · 익절까지 거리 · 청산까지 거리를 한 테이블로 보여줍니다</p>

  <div class="panel">
    <div class="panel-label">현재가</div>
    <div class="price-row">
      <span class="lbl">BTC/USDT</span>
      <span class="val" id="livePrice">불러오는 중…</span>
    </div>
    <div class="price-src" id="priceSrc"></div>
  </div>

  <div class="panel">
    <div class="panel-label">텔레그램 텍스트 붙여넣기 (여러 세트 한 번에 가능)</div>
    <textarea id="input" placeholder="예)
용1
비트유닉스
UID : 347473866
롱
충 : 10000
평단 : 63460
TP : 64833 (800) 800
청산 : 46485

————————

UID : 1750891319
숏
충 : 10000
평단 : 63460
TP : 62157 (800) 800
청산 : 79279

비트유닉스
UID : 000000
롱
충 : 10000
평단 : 63100
TP : 65200 (800) 800
청산 : 45900"></textarea>
    <button id="parseBtn">한눈에 보기</button>
    <div class="err" id="errBox"></div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <div class="panel-label">세트별 보기 (익절까지 가까운 순)</div>
    <div id="resultBody"></div>
  </div>
</div>

<script>
let currentPrice = null;

const priceEl = document.getElementById('livePrice');
const srcEl = document.getElementById('priceSrc');

function setPrice(p, src){
  currentPrice = p;
  priceEl.textContent = '$' + p.toLocaleString('en-US', {maximumFractionDigits:1});
  srcEl.textContent = src + ' · ' + new Date().toLocaleTimeString('ko-KR');
  if(lastPositions) renderTable(lastPositions);
}

async function fetchBitunix(){
  const res = await fetch('https://fapi.bitunix.com/api/v1/futures/market/tickers?symbols=BTCUSDT');
  const data = await res.json();
  return parseFloat(data.data[0].lastPrice);
}
async function fetchBinance(){
  const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
  const data = await res.json();
  return parseFloat(data.price);
}
async function pollPriceFallback(){
  try{
    const p = await fetchBitunix();
    setPrice(p, 'Bitunix (대체)');
  }catch(e){
    try{
      const p = await fetchBinance();
      setPrice(p, 'Binance (대체)');
    }catch(e2){
      srcEl.textContent = '가격 조회 실패 - 재시도 중…';
    }
  }
}

let fallbackInterval = null;
function startFallbackPolling(){
  if(fallbackInterval) return;
  pollPriceFallback();
  fallbackInterval = setInterval(pollPriceFallback, 5000);
}
function stopFallbackPolling(){
  if(fallbackInterval){ clearInterval(fallbackInterval); fallbackInterval = null; }
}

let ws = null;
let wsPingTimer = null;
let wsWatchdog = null;

function connectBitgetWS(){
  try{
    ws = new WebSocket('wss://ws.bitget.com/v2/ws/public');
  }catch(e){
    startFallbackPolling();
    return;
  }

  ws.onopen = () => {
    ws.send(JSON.stringify({
      op: 'subscribe',
      args: [{ instType: 'USDT-FUTURES', channel: 'ticker', instId: 'BTCUSDT' }]
    }));
    wsPingTimer = setInterval(() => { if(ws.readyState === 1) ws.send('ping'); }, 25000);
  };

  ws.onmessage = (evt) => {
    if(evt.data === 'pong') return;
    let msg;
    try{ msg = JSON.parse(evt.data); }catch(e){ return; }
    if(msg.data && msg.data[0] && msg.data[0].lastPr){
      stopFallbackPolling();
      setPrice(parseFloat(msg.data[0].lastPr), 'Bitget 실시간');
      resetWatchdog();
    }
  };

  ws.onerror = () => { startFallbackPolling(); };
  ws.onclose = () => {
    clearInterval(wsPingTimer);
    startFallbackPolling();
    setTimeout(connectBitgetWS, 4000);
  };

  resetWatchdog();
}

function resetWatchdog(){
  clearTimeout(wsWatchdog);
  wsWatchdog = setTimeout(() => { startFallbackPolling(); }, 10000);
}

connectBitgetWS();

function num(str){
  if(!str) return null;
  const n = parseFloat(String(str).replace(/,/g,''));
  return isNaN(n) ? null : n;
}
function won(n){
  return n.toLocaleString('en-US', {maximumFractionDigits:0});
}

const KNOWN_EXCHANGES = ['비트유닉스', '디지파이넥스', '비트겟', '바이낸스', '바이비트'];

function isFieldLine(line){
  return /^(UID|충|평단|TP|청산)\s*[:：]/.test(line) || /^(롱|숏)$/.test(line);
}
function isNoiseLine(line){
  if(line === '') return true;
  if(/^(오전|오후)\s*\d{1,2}:\d{2}/.test(line)) return true;
  if(/님이\s*(그룹명|그룹\s*이름)/.test(line)) return true;
  if(/^\d+월\s*\d+일/.test(line)) return true;
  if(/^[-–—]{3,}$/.test(line)) return true;
  return false;
}

function parseFields(lines){
  const full = lines.join('\n');
  const dirM = full.match(/(롱|숏)/);
  const avgM = full.match(/평단\s*[:：]\s*([\d,.]+)/);
  const liqM = full.match(/청산\s*[:：]\s*([\d,.]+)/);
  if(!dirM || !avgM) return null;

  const uidM = full.match(/UID\s*[:：]?\s*(\d+)/);
  const totalM = full.match(/충\s*[:：]\s*([\d,]+)/);

  const tpLine = lines.find(l => /^TP\s*[:：]/.test(l));
  const tpPriceM = tpLine ? tpLine.match(/TP\s*[:：]\s*([\d,.]+)/) : null;
  const tp = tpPriceM ? num(tpPriceM[1]) : null;

  // 괄호 뒤에 오는 숫자는 전부 물타기(추가 진입) 금액 — 몇 개가 오든 다 더함. 괄호 안 숫자는 무시(TP 도달시 예상수익 메모).
  let marginFromTp = null;
  if(tpLine){
    const afterParenM = tpLine.match(/\)\s*(.*)$/);
    if(afterParenM){
      const trailingNums = afterParenM[1].match(/[\d,]+/g);
      if(trailingNums && trailingNums.length > 0){
        marginFromTp = trailingNums.reduce((sum, n) => sum + (num(n) || 0), 0);
      }
    }
  }

  const labelLines = lines.filter(l => !isFieldLine(l));
  const exchLine = labelLines.find(l => KNOWN_EXCHANGES.some(k => l.includes(k)));
  const exch = exchLine || '';
  const nameCandidates = labelLines.filter(l => l !== exchLine);
  const name = nameCandidates[0] || exch || '이름없음';

  const totalDeposit = totalM ? num(totalM[1]) : null;
  const marginUsed = marginFromTp !== null ? marginFromTp : totalDeposit;

  return {
    name, exch, uid: uidM ? uidM[1] : '-',
    direction: dirM[1], avg: num(avgM[1]), tp,
    liq: liqM ? num(liqM[1]) : null, marginUsed, totalDeposit
  };
}

// UID 줄을 앵커로 각 포지션을 잘라냄 — 메시지 사이 시간/시스템 메시지/날짜 구분선/---
// 같은 텔레그램 노이즈가 섞여 있어도 안정적으로 포지션을 분리한다.
function parseText(text){
  // "[2026-08-14 오후 6:13] 준영이: 김해" 처럼 메시지 앞에 날짜/시간/발신자가 붙어서
  // 첫 줄과 한 줄로 합쳐져 나오는 복사 형식도 처리 — 대괄호 prefix 제거
  const rawLines = text.split('\n').map(l =>
    l.trim().replace(/^\[\d{4}-\d{2}-\d{2}\s*(?:오전|오후)\s*\d{1,2}:\d{2}\]\s*[^:\n]+:\s*/, '')
  );
  const n = rawLines.length;

  const uidIndices = [];
  for(let i = 0; i < n; i++){
    if(/^UID\s*[:：]?\s*\d+/.test(rawLines[i])) uidIndices.push(i);
  }

  const positions = [];
  let claimedUntil = -1;

  for(const i of uidIndices){
    const header = [];
    let j = i - 1;
    while(j > claimedUntil && j >= 0){
      const line = rawLines[j];
      if(line === ''){ j--; continue; }
      if(isFieldLine(line) || isNoiseLine(line)) break;
      header.unshift(line);
      j--;
      if(header.length >= 2) break;
    }

    const body = [];
    let m = i;
    while(m < n){
      const line = rawLines[m];
      if(line === ''){ m++; continue; }
      if(isFieldLine(line)){ body.push(line); m++; }
      else break;
    }
    claimedUntil = m - 1;

    const pos = parseFields([...header, ...body]);
    if(pos) positions.push(pos);
  }

  if(positions.length === 0){
    throw new Error('세트 정보를 찾지 못했습니다. 텍스트 형식을 확인해주세요.');
  }
  return positions;
}

let lastPositions = null;
let posByUid = {};

const LEVERAGE = 50;

// 물타기 계산: 이 포지션의 실제 평단·증거금·청산가로 거래소 공식을 역산(캘리브레이션)한 뒤,
// 지정한 %만큼 불리한 방향으로 이동한 가격에 같은 금액을 추가했다고 가정하고 새 평단·새 청산가를 재계산.
function computeWaterCalc(pos, waterPct){
  const waterPrice = pos.direction === '롱'
    ? pos.avg * (1 - waterPct / 100)
    : pos.avg * (1 + waterPct / 100);

  let newAvg = null, newLiq = null, calibOk = false;
  if(pos.liq !== null && pos.totalDeposit !== null && pos.marginUsed !== null){
    const notionalInit = pos.marginUsed * LEVERAGE;
    const ratioInit = pos.totalDeposit / notionalInit;
    const bufferPctInit = pos.direction === '롱'
      ? (pos.avg - pos.liq) / pos.avg
      : (pos.liq - pos.avg) / pos.avg;
    if(ratioInit > 0 && bufferPctInit > 0){
      const k = bufferPctInit / ratioInit;

      const qtyInit = notionalInit / pos.avg;
      const notionalAdd = pos.marginUsed * LEVERAGE;
      const qtyAdd = notionalAdd / waterPrice;
      const qtyTotal = qtyInit + qtyAdd;
      const notionalInvestedTotal = notionalInit + notionalAdd;
      newAvg = notionalInvestedTotal / qtyTotal;

      const newMarginTotal = pos.marginUsed * 2;
      const newNotional = newMarginTotal * LEVERAGE;
      const newRatio = pos.totalDeposit / newNotional;
      const newBufferPct = k * newRatio;
      newLiq = pos.direction === '롱' ? newAvg * (1 - newBufferPct) : newAvg * (1 + newBufferPct);
      calibOk = true;
    }
  }
  return { waterPrice, waterPct, newAvg, newLiq, calibOk };
}

function renderTable(positions){
  const bodyEl = document.getElementById('resultBody');
  const resultPanel = document.getElementById('resultPanel');

  if(currentPrice === null){
    return;
  }

  posByUid = {};
  const rows = positions.map(pos => {
    posByUid[pos.uid] = pos;

    const tpDistPct = pos.direction === '롱'
      ? (pos.tp - currentPrice) / currentPrice * 100
      : (currentPrice - pos.tp) / currentPrice * 100;

    // 목표수익률: TP가 평단 대비 몇 % 떨어진 곳에 걸려있는지 (텔레에 따로 안 적어도 평단/TP로 계산됨)
    const targetPct = pos.direction === '롱'
      ? (pos.tp - pos.avg) / pos.avg * 100
      : (pos.avg - pos.tp) / pos.avg * 100;

    const priceChangePct = pos.direction === '롱'
      ? (currentPrice - pos.avg) / pos.avg
      : (pos.avg - currentPrice) / pos.avg;
    const pnlAmount = pos.marginUsed !== null ? priceChangePct * LEVERAGE * pos.marginUsed : null;
    const pnlPct = priceChangePct * LEVERAGE * 100;

    let liqDistPct = null;
    if(pos.liq !== null){
      liqDistPct = pos.direction === '롱'
        ? (currentPrice - pos.liq) / currentPrice * 100
        : (pos.liq - currentPrice) / currentPrice * 100;
    }

    const water = computeWaterCalc(pos, 3);

    return { ...pos, tpDistPct, targetPct, pnlAmount, pnlPct, liqDistPct, ...water };
  });

  // 파싱된 순서대로 2개씩(롱+숏) 묶어서 하나의 "세트"로 그룹핑.
  // 실제 붙여넣는 텍스트가 항상 세트 단위(롱 다음 숏)로 이어지는 것을 이용한 방식이라,
  // 홀수로 남는 마지막 포지션은 혼자 있는 그룹으로 처리한다.
  const groups = [];
  for(let i = 0; i < rows.length; i += 2){
    const legs = rows.slice(i, i + 2);
    const label = legs.find(l => l.name && !KNOWN_EXCHANGES.includes(l.name))?.name || legs[0].name;
    const minAbsTpDist = Math.min(...legs.map(l => Math.abs(l.tpDistPct)));
    groups.push({ label, legs, minAbsTpDist });
  }

  groups.sort((a, b) => a.minAbsTpDist - b.minAbsTpDist);

  function legHtml(r){
    const dirClass = r.direction === '롱' ? 'long' : 'short';
    const urgency = Math.abs(r.tpDistPct) < 0.5 ? 'urgent' : Math.abs(r.tpDistPct) < 2 ? 'close' : 'far';
    const tpDistLabel = (r.tpDistPct >= 0 ? '' : '도달 ') + Math.abs(r.tpDistPct).toFixed(2) + '%';

    const pnlUp = r.pnlAmount !== null && r.pnlAmount >= 0;
    const pnlLabel = r.pnlAmount !== null
      ? `${pnlUp ? '+' : ''}${won(r.pnlAmount)} (${pnlUp ? '+' : ''}${r.pnlPct.toFixed(1)}%)`
      : '-';

    let liqLabel = '-', liqClass = '';
    if(r.liqDistPct !== null){
      liqClass = r.liqDistPct < 5 ? 'urgent' : r.liqDistPct < 15 ? 'close' : 'far';
      liqLabel = Math.abs(r.liqDistPct).toFixed(1) + '%';
    }

    const uidSafe = String(r.uid).replace(/[^a-zA-Z0-9]/g, '');

    return `
    <div class="leg">
      <div class="leg-top">
        <span class="badge ${dirClass}">${r.direction}</span>
        <span class="leg-exch">${r.exch || '-'} · ${r.uid}</span>
        <span class="leg-pnl ${pnlUp ? 'pnl-up' : 'pnl-down'}">${pnlLabel}</span>
      </div>
      <div class="field-row"><span class="lbl">평단</span><span class="val">${won(r.avg)}</span></div>
      <div class="field-row"><span class="lbl">목표%</span><span class="val target">${r.targetPct.toFixed(2)}%</span></div>
      <div class="field-row"><span class="lbl">익절가</span><span class="val">${won(r.tp)}</span></div>
      <div class="field-row"><span class="lbl">익절까지</span><span class="val dist ${urgency}">${tpDistLabel}</span></div>
      <div class="field-row"><span class="lbl">청산가</span><span class="val">${r.liq !== null ? won(r.liq) : '-'}</span></div>
      <div class="field-row"><span class="lbl">청산까지</span><span class="val dist ${liqClass}">${liqLabel}</span></div>
      <div class="water-box">
        <div class="water-row1">
          <span>물타기</span>
          <input type="number" class="water-pct-input" data-uid="${r.uid}" value="${r.waterPct}" step="0.5" min="0.5">
          <span>% → <b id="waterPriceVal-${uidSafe}">${won(r.waterPrice)}</b></span>
        </div>
        <div class="water-sub" id="waterResult-${uidSafe}" style="display:${r.calibOk ? 'block' : 'none'};">
          예상 평단 <b id="newAvgVal-${uidSafe}">${r.calibOk ? won(r.newAvg) : '-'}</b><br>
          예상 청산가 <b id="newLiqVal-${uidSafe}">${r.calibOk ? won(r.newLiq) : '-'}</b>
        </div>
      </div>
    </div>`;
  }

  bodyEl.innerHTML = groups.map(g => {
    const urgency = g.minAbsTpDist < 0.5 ? 'urgent' : g.minAbsTpDist < 2 ? 'close' : '';
    return `
    <div class="set-group ${urgency}">
      <div class="set-title">세트: ${g.label}</div>
      ${g.legs.map(legHtml).join('')}
    </div>`;
  }).join('');

  resultPanel.style.display = 'block';
}

document.getElementById('parseBtn').addEventListener('click', () => {
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';

  if(currentPrice === null){
    errBox.textContent = '현재가를 아직 불러오는 중입니다. 잠시 후 다시 시도해주세요.';
    errBox.style.display = 'block';
    return;
  }

  try{
    const text = document.getElementById('input').value;
    const positions = parseText(text);
    lastPositions = positions;
    renderTable(positions);
  }catch(e){
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  }
});

document.getElementById('resultBody').addEventListener('input', (e) => {
  if(!e.target.classList.contains('water-pct-input')) return;
  const uid = e.target.dataset.uid;
  const uidSafe = String(uid).replace(/[^a-zA-Z0-9]/g, '');
  const pos = posByUid[uid];
  if(!pos) return;

  const pctVal = parseFloat(e.target.value);
  const pct = (!isNaN(pctVal) && pctVal > 0) ? pctVal : 3;
  const water = computeWaterCalc(pos, pct);

  const priceEl2 = document.getElementById('waterPriceVal-' + uidSafe);
  if(priceEl2) priceEl2.textContent = won(water.waterPrice);

  const resultBox = document.getElementById('waterResult-' + uidSafe);
  const newAvgEl = document.getElementById('newAvgVal-' + uidSafe);
  const newLiqEl = document.getElementById('newLiqVal-' + uidSafe);
  if(resultBox){
    resultBox.style.display = water.calibOk ? 'block' : 'none';
    if(water.calibOk){
      newAvgEl.textContent = won(water.newAvg);
      newLiqEl.textContent = won(water.newLiq);
    }
  }
});


</script>
</body>
</html>
