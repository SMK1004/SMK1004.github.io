<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포지션 한눈에 · SMK1004</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg:#0e1013;
    --panel:#15181c;
    --panel2:#1a1e23;
    --line:#262b31;
    --text:#eceff1;
    --sub:#838d97;
    --brass:#c9a466;
    --red:#e0605a;
    --green:#4fbf7a;
    --sans:'Pretendard', -apple-system, 'Malgun Gothic', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px; margin:0 auto;}
  .top{display:flex; align-items:center; gap:10px; margin-bottom:20px;}
  .top a{
    color:var(--sub); text-decoration:none; font-size:14px;
    border:1px solid var(--line); padding:6px 12px; border-radius:8px;
  }
  .top a:hover{border-color:var(--brass); color:var(--brass);}
  h1{font-size:22px; font-weight:700; margin:0 0 4px;}
  .sub{color:var(--sub); font-size:14px; margin:0 0 20px;}

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    margin-bottom:16px;
  }
  .panel-label{
    font-size:12px; letter-spacing:1px; text-transform:uppercase;
    color:var(--sub); margin-bottom:10px; font-weight:600;
  }
  .price-row{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:2px;}
  .price-row .lbl{color:var(--sub); font-size:13px;}
  .price-row .val{font-size:15px; font-weight:600; font-variant-numeric:tabular-nums;}
  .price-src{color:var(--sub); font-size:11px;}

  textarea{
    width:100%;
    min-height:220px;
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    padding:12px;
    resize:vertical;
  }
  textarea::placeholder{color:#4a5157;}

  button{
    width:100%;
    margin-top:12px;
    background:var(--brass);
    color:#141414;
    border:none;
    border-radius:8px;
    padding:13px;
    font-size:15px;
    font-weight:700;
    font-family:var(--sans);
    cursor:pointer;
  }
  button:hover{filter:brightness(1.06);}

  .err{color:var(--red); font-size:13px; margin-top:10px; display:none;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  thead th{
    text-align:left; color:var(--sub); font-weight:600; font-size:11px;
    letter-spacing:.5px; text-transform:uppercase;
    padding:0 8px 8px; border-bottom:1px solid var(--line);
  }
  tbody td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr.urgent{background:rgba(224,96,90,.08);}
  tbody tr.close{background:rgba(201,164,102,.08);}

  .set-name{font-weight:700; font-size:13px;}
  .set-exch{color:var(--sub); font-size:11px;}
  .badge{font-size:11px; font-weight:700; padding:2px 7px; border-radius:5px; display:inline-block;}
  .badge.long{background:rgba(79,191,122,.15); color:var(--green);}
  .badge.short{background:rgba(224,96,90,.15); color:var(--red);}
  .num{font-variant-numeric:tabular-nums; white-space:nowrap;}
  .dist{font-weight:700; font-variant-numeric:tabular-nums;}
  .dist.urgent{color:var(--red);}
  .dist.close{color:var(--brass);}
  .dist.far{color:var(--sub);}
  .pnl-up{color:var(--green);}
  .pnl-down{color:var(--red);}

  .empty{color:var(--sub); font-size:14px; text-align:center; padding:30px 0;}

  @media (max-width: 560px){
    table, thead, tbody, th, td, tr{display:block;}
    thead{display:none;}
    tbody tr{
      background:var(--panel2); border:1px solid var(--line); border-radius:10px;
      padding:12px; margin-bottom:8px;
    }
    tbody tr.urgent{border-color:var(--red);}
    tbody tr.close{border-color:var(--brass);}
    tbody td{border:none; padding:3px 0;}
    .mobile-row{display:flex; justify-content:space-between; align-items:center;}
    .mobile-label{color:var(--sub); font-size:11px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">← 홈</a></div>
  <h1>포지션 한눈에</h1>
  <p class="sub">모든 세트를 한 번에 붙여넣으면 손익 · 익절까지 거리 · 청산까지 거리를 한 테이블로 보여줍니다</p>

  <div class="panel">
    <div class="panel-label">현재가</div>
    <div class="price-row">
      <span class="lbl">BTC/USDT</span>
      <span class="val" id="livePrice">불러오는 중…</span>
    </div>
    <div class="price-src" id="priceSrc"></div>
  </div>

  <div class="panel">
    <div class="panel-label">텔레그램 텍스트 붙여넣기 (여러 세트 한 번에 가능)</div>
    <textarea id="input" placeholder="예)
용1
비트유닉스
UID : 347473866
롱
충 : 10000
평단 : 63460
TP : 64833 (800) 800
청산 : 46485

————————
용1
디지파이넥스
UID : 1750891319
숏
충 : 10000
평단 : 63460
TP : 62157 (800) 800
청산 : 79279

————————
용2
비트유닉스
UID : 000000
롱
충 : 10000
평단 : 63100
TP : 65200 (800) 800
청산 : 45900"></textarea>
    <button id="parseBtn">한눈에 보기</button>
    <div class="err" id="errBox"></div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <div class="panel-label">전체 포지션 (익절까지 가까운 순)</div>
    <table>
      <thead>
        <tr>
          <th>세트</th>
          <th>방향</th>
          <th>평단</th>
          <th>손익</th>
          <th>익절가</th>
          <th>익절까지</th>
          <th>청산까지</th>
        </tr>
      </thead>
      <tbody id="resultBody"></tbody>
    </table>
  </div>
</div>

<script>
let currentPrice = null;

const priceEl = document.getElementById('livePrice');
const srcEl = document.getElementById('priceSrc');

function setPrice(p, src){
  currentPrice = p;
  priceEl.textContent = '$' + p.toLocaleString('en-US', {maximumFractionDigits:1});
  srcEl.textContent = src + ' · ' + new Date().toLocaleTimeString('ko-KR');
  if(lastPositions) renderTable(lastPositions);
}

async function fetchBitunix(){
  const res = await fetch('https://fapi.bitunix.com/api/v1/futures/market/tickers?symbols=BTCUSDT');
  const data = await res.json();
  return parseFloat(data.data[0].lastPrice);
}
async function fetchBinance(){
  const res = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT');
  const data = await res.json();
  return parseFloat(data.price);
}
async function pollPriceFallback(){
  try{
    const p = await fetchBitunix();
    setPrice(p, 'Bitunix (대체)');
  }catch(e){
    try{
      const p = await fetchBinance();
      setPrice(p, 'Binance (대체)');
    }catch(e2){
      srcEl.textContent = '가격 조회 실패 - 재시도 중…';
    }
  }
}

let fallbackInterval = null;
function startFallbackPolling(){
  if(fallbackInterval) return;
  pollPriceFallback();
  fallbackInterval = setInterval(pollPriceFallback, 5000);
}
function stopFallbackPolling(){
  if(fallbackInterval){ clearInterval(fallbackInterval); fallbackInterval = null; }
}

let ws = null;
let wsPingTimer = null;
let wsWatchdog = null;

function connectBitgetWS(){
  try{
    ws = new WebSocket('wss://ws.bitget.com/v2/ws/public');
  }catch(e){
    startFallbackPolling();
    return;
  }

  ws.onopen = () => {
    ws.send(JSON.stringify({
      op: 'subscribe',
      args: [{ instType: 'USDT-FUTURES', channel: 'ticker', instId: 'BTCUSDT' }]
    }));
    wsPingTimer = setInterval(() => { if(ws.readyState === 1) ws.send('ping'); }, 25000);
  };

  ws.onmessage = (evt) => {
    if(evt.data === 'pong') return;
    let msg;
    try{ msg = JSON.parse(evt.data); }catch(e){ return; }
    if(msg.data && msg.data[0] && msg.data[0].lastPr){
      stopFallbackPolling();
      setPrice(parseFloat(msg.data[0].lastPr), 'Bitget 실시간');
      resetWatchdog();
    }
  };

  ws.onerror = () => { startFallbackPolling(); };
  ws.onclose = () => {
    clearInterval(wsPingTimer);
    startFallbackPolling();
    setTimeout(connectBitgetWS, 4000);
  };

  resetWatchdog();
}

function resetWatchdog(){
  clearTimeout(wsWatchdog);
  wsWatchdog = setTimeout(() => { startFallbackPolling(); }, 10000);
}

connectBitgetWS();

function num(str){
  if(!str) return null;
  const n = parseFloat(String(str).replace(/,/g,''));
  return isNaN(n) ? null : n;
}
function won(n){
  return n.toLocaleString('en-US', {maximumFractionDigits:0});
}

const KNOWN_EXCHANGES = ['비트유닉스', '디지파이넥스', '비트겟', '바이낸스', '바이비트'];

function isFieldLine(line){
  return /^(UID|충|평단|TP|청산)\s*[:：]/.test(line) || /^(롱|숏)$/.test(line);
}
function isNoiseLine(line){
  if(line === '') return true;
  if(/^(오전|오후)\s*\d{1,2}:\d{2}/.test(line)) return true;
  if(/님이\s*(그룹명|그룹\s*이름)/.test(line)) return true;
  if(/^\d+월\s*\d+일/.test(line)) return true;
  if(/^[-–—]{3,}$/.test(line)) return true;
  return false;
}

function parseFields(lines){
  const full = lines.join('\n');
  const dirM = full.match(/(롱|숏)/);
  const avgM = full.match(/평단\s*[:：]\s*([\d,.]+)/);
  const liqM = full.match(/청산\s*[:：]\s*([\d,.]+)/);
  if(!dirM || !avgM) return null;

  const uidM = full.match(/UID\s*[:：]?\s*(\d+)/);
  const totalM = full.match(/충\s*[:：]\s*([\d,]+)/);

  const tpLine = lines.find(l => /^TP\s*[:：]/.test(l));
  const tpPriceM = tpLine ? tpLine.match(/TP\s*[:：]\s*([\d,.]+)/) : null;
  const tp = tpPriceM ? num(tpPriceM[1]) : null;

  // 괄호 뒤에 오는 숫자는 전부 물타기(추가 진입) 금액 — 몇 개가 오든 다 더함. 괄호 안 숫자는 무시(TP 도달시 예상수익 메모).
  let marginFromTp = null;
  if(tpLine){
    const afterParenM = tpLine.match(/\)\s*(.*)$/);
    if(afterParenM){
      const trailingNums = afterParenM[1].match(/[\d,]+/g);
      if(trailingNums && trailingNums.length > 0){
        marginFromTp = trailingNums.reduce((sum, n) => sum + (num(n) || 0), 0);
      }
    }
  }

  const labelLines = lines.filter(l => !isFieldLine(l));
  const exchLine = labelLines.find(l => KNOWN_EXCHANGES.some(k => l.includes(k)));
  const exch = exchLine || '';
  const nameCandidates = labelLines.filter(l => l !== exchLine);
  const name = nameCandidates[0] || exch || '이름없음';

  const totalDeposit = totalM ? num(totalM[1]) : null;
  const marginUsed = marginFromTp !== null ? marginFromTp : totalDeposit;

  return {
    name, exch, uid: uidM ? uidM[1] : '-',
    direction: dirM[1], avg: num(avgM[1]), tp,
    liq: liqM ? num(liqM[1]) : null, marginUsed
  };
}

// UID 줄을 앵커로 각 포지션을 잘라냄 — 메시지 사이 시간/시스템 메시지/날짜 구분선/---
// 같은 텔레그램 노이즈가 섞여 있어도 안정적으로 포지션을 분리한다.
function parseText(text){
  const rawLines = text.split('\n').map(l => l.trim());
  const n = rawLines.length;

  const uidIndices = [];
  for(let i = 0; i < n; i++){
    if(/^UID\s*[:：]?\s*\d+/.test(rawLines[i])) uidIndices.push(i);
  }

  const positions = [];
  let claimedUntil = -1;

  for(const i of uidIndices){
    const header = [];
    let j = i - 1;
    while(j > claimedUntil && j >= 0){
      const line = rawLines[j];
      if(line === ''){ j--; continue; }
      if(isFieldLine(line) || isNoiseLine(line)) break;
      header.unshift(line);
      j--;
      if(header.length >= 2) break;
    }

    const body = [];
    let m = i;
    while(m < n){
      const line = rawLines[m];
      if(line === ''){ m++; continue; }
      if(isFieldLine(line)){ body.push(line); m++; }
      else break;
    }
    claimedUntil = m - 1;

    const pos = parseFields([...header, ...body]);
    if(pos) positions.push(pos);
  }

  if(positions.length === 0){
    throw new Error('세트 정보를 찾지 못했습니다. 텍스트 형식을 확인해주세요.');
  }
  return positions;
}

let lastPositions = null;

const LEVERAGE = 50;

function renderTable(positions){
  const tbody = document.getElementById('resultBody');
  const resultPanel = document.getElementById('resultPanel');

  if(currentPrice === null){
    return;
  }

  const rows = positions.map(pos => {
    const tpDistPct = pos.direction === '롱'
      ? (pos.tp - currentPrice) / currentPrice * 100
      : (currentPrice - pos.tp) / currentPrice * 100;

    const priceChangePct = pos.direction === '롱'
      ? (currentPrice - pos.avg) / pos.avg
      : (pos.avg - currentPrice) / pos.avg;
    const pnlAmount = pos.marginUsed !== null ? priceChangePct * LEVERAGE * pos.marginUsed : null;
    const pnlPct = priceChangePct * LEVERAGE * 100;

    let liqDistPct = null;
    if(pos.liq !== null){
      liqDistPct = pos.direction === '롱'
        ? (currentPrice - pos.liq) / currentPrice * 100
        : (pos.liq - currentPrice) / currentPrice * 100;
    }

    return { ...pos, tpDistPct, pnlAmount, pnlPct, liqDistPct };
  });

  rows.sort((a, b) => Math.abs(a.tpDistPct) - Math.abs(b.tpDistPct));

  tbody.innerHTML = rows.map(r => {
    const dirClass = r.direction === '롱' ? 'long' : 'short';
    const urgency = Math.abs(r.tpDistPct) < 0.5 ? 'urgent' : Math.abs(r.tpDistPct) < 2 ? 'close' : 'far';
    const rowClass = urgency === 'urgent' ? 'urgent' : urgency === 'close' ? 'close' : '';
    const tpDistLabel = (r.tpDistPct >= 0 ? '' : '도달 ') + Math.abs(r.tpDistPct).toFixed(2) + '%';

    const pnlUp = r.pnlAmount !== null && r.pnlAmount >= 0;
    const pnlLabel = r.pnlAmount !== null
      ? `${pnlUp ? '+' : ''}${won(r.pnlAmount)} <span style="opacity:.7">(${pnlUp ? '+' : ''}${r.pnlPct.toFixed(1)}%)</span>`
      : '-';

    let liqLabel = '-';
    let liqClass = '';
    if(r.liqDistPct !== null){
      liqClass = r.liqDistPct < 5 ? 'urgent' : r.liqDistPct < 15 ? 'close' : 'far';
      liqLabel = Math.abs(r.liqDistPct).toFixed(1) + '%';
    }

    return `
    <tr class="${rowClass}">
      <td>
        <div class="mobile-label">세트</div>
        <div class="set-name">${r.name}</div>
        <div class="set-exch">${r.exch || '-'}</div>
      </td>
      <td><div class="mobile-label">방향</div><span class="badge ${dirClass}">${r.direction}</span></td>
      <td><div class="mobile-label">평단</div><span class="num">${won(r.avg)}</span></td>
      <td><div class="mobile-label">손익</div><span class="num ${pnlUp ? 'pnl-up' : 'pnl-down'}">${pnlLabel}</span></td>
      <td><div class="mobile-label">익절가</div><span class="num">${won(r.tp)}</span></td>
      <td><div class="mobile-label">익절까지</div><span class="dist ${urgency}">${tpDistLabel}</span></td>
      <td><div class="mobile-label">청산까지</div><span class="dist ${liqClass}">${liqLabel}</span></td>
    </tr>`;
  }).join('');

  resultPanel.style.display = 'block';
}

document.getElementById('parseBtn').addEventListener('click', () => {
  const errBox = document.getElementById('errBox');
  errBox.style.display = 'none';

  if(currentPrice === null){
    errBox.textContent = '현재가를 아직 불러오는 중입니다. 잠시 후 다시 시도해주세요.';
    errBox.style.display = 'block';
    return;
  }

  try{
    const text = document.getElementById('input').value;
    const positions = parseText(text);
    lastPositions = positions;
    renderTable(positions);
  }catch(e){
    errBox.textContent = e.message;
    errBox.style.display = 'block';
  }
});
</script>
</body>
</html>
