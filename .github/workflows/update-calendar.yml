name: Update Economic Calendar

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch calendar data
        run: |
          curl -sL -A "Mozilla/5.0" "https://nfs.faireconomy.media/ff_calendar_thisweek.json" -o calendar-data.json
          # 응답이 유효한 JSON 배열인지 확인 (실패 시 기존 파일 유지)
          if ! python3 -c "import json,sys; d=json.load(open('calendar-data.json')); sys.exit(0 if isinstance(d, list) and len(d)>0 else 1)"; then
            echo "Invalid response, keeping previous calendar-data.json"
            git checkout -- calendar-data.json
          fi

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add calendar-data.json
          git diff --staged --quiet || git commit -m "Update calendar data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
